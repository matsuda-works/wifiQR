<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>WiFi Connect QR</h1>
            <p>SSIDとパスワードを入力して、接続用のQRコードを作成します。</p>
        </header>

        <div class="form-card">
            <!-- ブラウザのログイン誤認（自動入力）を防止するためのダミーフィールド -->
            <div style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;" aria-hidden="true">
                <input type="text" tabindex="-1" autocomplete="username">
                <input type="password" tabindex="-1" autocomplete="current-password">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="ssid">ネットワーク名 (SSID)</label>
                    <span id="history-badge" class="history-badge hidden">候補あり</span>
                </div>
                <input type="text" id="ssid" list="ssid-suggestions" placeholder="例: MyHomeWiFi" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true">
                <datalist id="ssid-suggestions"></datalist>

                <!-- 履歴・保存済み候補チップ -->
                <div id="history-container" class="history-container hidden">
                    <div class="history-header">
                        <span class="history-title">よく使う・履歴候補:</span>
                        <button type="button" id="clear-history-btn" class="text-link-btn">すべて消去</button>
                    </div>
                    <div id="history-chips" class="history-chips"></div>
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="password">パスワード</label>
                    <button type="button" id="toggle-password-btn" class="text-link-btn toggle-visibility-btn">表示</button>
                </div>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" data-lpignore="true" data-form-type="other">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="encryption">セキュリティ</label>
                    <select id="encryption">
                        <option value="WPA">WPA/WPA2/WPA3 (推奨)</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">なし</option>
                    </select>
                </div>
                <div class="input-group hidden-option" id="hidden-group">
                    <label for="hidden">非公開ネットワーク</label>
                    <div class="toggle-wrapper">
                        <input type="checkbox" id="hidden">
                        <label class="toggle-label" for="hidden"></label>
                    </div>
                </div>
            </div>

            <!-- 履歴保存設定 -->
            <div class="save-options">
                <label class="custom-checkbox">
                    <input type="checkbox" id="save-history" checked>
                    <span class="checkmark"></span>
                    <span class="checkbox-text">このWi-Fiを候補リストに保存する</span>
                </label>
                <label class="custom-checkbox sub-checkbox">
                    <input type="checkbox" id="save-password">
                    <span class="checkmark"></span>
                    <span class="checkbox-text">パスワードも記憶する <span class="privacy-note">(お使いの端末内にのみ保存)</span></span>
                </label>
            </div>

            <button id="generate-btn">QRコードを生成</button>
        </div>

        <div id="qr-result-container" class="qr-result-container hidden">
            <div class="qr-card">
                <div id="qrcode"></div>
                <div class="qr-info">
                    <h2 id="display-ssid"></h2>
                    <p>このQRコードをカメラでスキャンしてWiFiに接続できます。</p>
                </div>
                <button id="download-btn" class="secondary-btn">画像を保存</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
